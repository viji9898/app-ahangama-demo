<svg xmlns="http://www.w3.org/2000/svg" width="438" height="307" viewBox="0 0 438 307" fill="none">
  <title>Rolled yoga mat icon</title>
  <g stroke="#242424" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- unrolled mat base -->
    <path d="M92 250
             C124 251 168 255 218 259
             C246 261 272 261 284 257
             L397 137
             C404 129 399 121 388 120
             L278 114" />

    <!-- rolled cylinder outer body -->
