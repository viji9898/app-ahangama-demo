             L211 40
             C236 21 274 30 289 58
             C304 87 296 119 272 140
             L137 254" />

    <!-- front circular roll -->
    <ellipse cx="94" cy="201" rx="64" ry="56" transform="rotate(-20 94 201)" />

    <!-- spiral inside roll -->
    <path d="M76 198
             C77 181 91 169 108 173
             C128 178 139 199 130 218
             C117 245 79 250 57 229
             C29 202 44 155 82 144
             C126 131 169 169 160 215
             C151 261 96 280 56 254" />

    <!-- lower edge of mat connected to roll -->
