[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.21.1"

[dev]
  port = 8889
  targetPort = 5173

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."api-venue-stats"]
  external_node_modules = [
    "googleapis",
    "googleapis-common",
    "google-auth-library",
    "gaxios",
    "gtoken",
    "gcp-metadata",
    "node-fetch",
    "fetch-blob",
    "formdata-polyfill"
  ]

[[redirects]]
  from = "/partners-knowledge"
  to = "/.netlify/functions/partners-knowledge"
  status = 200

[[redirects]]
  from = "/api/partners-knowledge"
  to = "/.netlify/functions/partners-knowledge?format=json"
  status = 200

[[redirects]]
  from = "/api/venues"
  to = "/.netlify/functions/api-venues-list"
  status = 200

[[redirects]]
  from = "/api/venue-logos"
  to = "/.netlify/functions/api-venue-logos"
  status = 200

[[redirects]]
  from = "/api/guide/venues"
  to = "/.netlify/functions/api-guide-venues"
  status = 200

[[redirects]]
  from = "/api/guide/venue"
  to = "/.netlify/functions/api-guide-venue"
  status = 200

[[redirects]]
  from = "/api/guide/content"
  to = "/.netlify/functions/api-guide-content"
  status = 200

[[redirects]]
  from = "/api/guide/google-rating"
  to = "/.netlify/functions/api-guide-google-rating"
  status = 200

[[redirects]]
  from = "/api/guide/image-sizes"
  to = "/.netlify/functions/api-guide-image-sizes"
  status = 200

[[redirects]]
  from = "/api/venue-stats"
  to = "/.netlify/functions/api-venue-stats"
  status = 200

[[redirects]]
  from = "/api/venue-content"
  to = "/.netlify/functions/api-venue-content"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


